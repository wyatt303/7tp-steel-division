weapon_base = "Carrier_Loyd_POL"
layout = "truck"
rts_texture = "Texture_RTS_H_Carrier_Loyd"   # znaczek nad jednostką jak u Loyda
name = "C2P"
alias = "C2P"
price = 0                          # transport: cena wliczona w paczkę, jak Loyd
year = 1937
speed_kmh = 22                     # w terenie, szacunek
road_speed_kmh = 45                # dane techniczne
strength = 6                       # jak Loyd
concealment = 1.5
armor_front = "Blindage_1"         # jak Loyd; cienkie blachy, otwarty z góry
armor_sides = "Blindage_1"
armor_rear = "Blindage_1"
armor_top = "Toit"

# 40 mm armata przeciwlotnicza wz. 36 Bofors. Ta sama armata 40 mm L/60 na tym samym dwuosiowym
# łożu co brytyjski QF Mk I/III w grze, więc model to Bofors 40 mm z gry przemalowany w kamuflaż
# z 1936 r. (scripts/build_bofors40.py, wynik w build/, bo to dane gry). Dane jednostki, broń,
# obsługa i animacje z polskiego Boforsa z gry (DCA_Bofors_POL).
[units.B40WZ36_POL]
model = "B40WZ36"
asset_folder = "POL/Canon"         # model w Assets/3D/Units/POL/Canon/B40WZ36, razem z Boites_B40WZ36
unit_base = "DCA_Bofors_POL"
weapon_base = "DCA_Bofors_POL"
layout = "gun"
depiction_replace = { "Modele_DCA_Bofors_US" = "Modele_B40WZ36_POL" }   # polski Bofors z gry używa modeli amerykańskiego
stocks = ["Ammo_Bofors40_wz36_HE"] # cele naziemne (HE) i powietrzne (AA) mają wspólny zapas, jak w grze
rts_texture = "Texture_RTS_H_DCA_Bofors"   # znaczek nad jednostką: ikona Boforsa z gry
transporter = "C2P_POL"            # ciągnik: C2P, jak w bateriach przeciwlotniczych 1939 r.
name = "B40WZ36"
alias = "40mm wz.36 Bofors"
price = 70                         # polski Bofors z gry (1941) kosztuje 80
year = 1936
speed_kmh = 10                     # jak Bofors z gry
road_speed_kmh = 10
strength = 8
concealment = 1.5
gun_traverse_deg = 360             # pełny obrót: gra zapisuje u Boforsa 2π (6,28)
armor_front = "Canon"              # jak Bofors z gry
armor_sides = "Canon"
armor_rear = "Canon"
armor_top = "Canon"
ammo = { Ammo_Bofors40_wz36_HE = 240 }   # 30 serii po 8 nabojów, jak w grze

# ---------------------------------------------------------------------------------------------
# Amunicja (broń). Wspólna dla wszystkich jednostek, które jej używają.
# W oknie jednostki gra pokazuje:
#   ACC   = accuracy
#   ROF   = rounds_per_salvo * 60 / (seconds_between_salvos + (shots_per_salvo - 1) * seconds_between_shots)
#   AP    = penetration
#   RANGE = range_m
# ---------------------------------------------------------------------------------------------

[ammo.Ammo_Bofors_wz37_AP]
copy_of = "Ammo_Canon_M5_37mmL_AP"   # wpis gry, z którego kopiujemy resztę pól (nie zmieniać)
name = "Bofors37"                    # token napisu z sekcji [texts]
caliber = "37mm"
penetration = 6                      # przebicie (AP)
accuracy = 4                         # celność na postoju (ACC)
accuracy_moving = 1                  # celność w ruchu
range_m = 1000                       # zasięg w metrach, jak w oknie jednostki
rounds_per_salvo = 1                 # naboje pokazywane na jedną serię
shots_per_salvo = 1                  # strzały w serii
seconds_between_shots = 6.0          # ok. 10 strz./min w praktyce (dobroni.pl)
seconds_between_salvos = 6.0

[ammo.Ammo_Bofors_wz37_HE]
copy_of = "Ammo_Canon_M5_37mmL_HE"
name = "Bofors37"
caliber = "37mm"
accuracy = 4
accuracy_moving = 1
range_m = 1000
rounds_per_salvo = 1
shots_per_salvo = 1
seconds_between_shots = 6.0
seconds_between_salvos = 6.0

# Armata ppanc wz. 36: ta sama lufa i amunicja co w 7TP, ale z ziemi strzelała szybciej
# (12-14 strz./min, Wikipedia). Przebicie jak w 7TP; M3 37 mm w grze ma 8, działo Stuarta 7.
[ammo.Ammo_Bofors_wz36_AP]
copy_of = "Ammo_CanonTracte_M3_37mmL_AP"
name = "Bofors36"
caliber = "37mm"
penetration = 6
accuracy = 5                         # jak M3 w grze
accuracy_moving = 1
range_m = 1000
rounds_per_salvo = 1
shots_per_salvo = 1
seconds_between_shots = 5.0          # 12 strz./min (M3 w grze: 10)
seconds_between_salvos = 5.0

# 40 mm wz. 36 Bofors: kopie amunicji Boforsa z gry (HE na cele naziemne, AA na samoloty) z polską
# nazwą. Wartości jak w grze: seria 8 nabojów (łódka 4 + 4), 0,6 s między strzałami.
[ammo.Ammo_Bofors40_wz36_HE]
copy_of = "Ammo_DCA_Bofors_40mm_HE"
name = "Bofors40"
rounds_per_salvo = 8

[ammo.Ammo_Bofors40_wz36_AA]
copy_of = "Ammo_DCA_Bofors_40mm_AA"
name = "Bofors40"
rounds_per_salvo = 8

[ammo.Ammo_ckm_wz30_vehicule]
copy_of = "Ammo_M1919_7_62mm_vehicule"
name = "CkmWz30"
caliber = "7_92mm"                   # gra pokazuje 7,92mm
accuracy = 5
accuracy_moving = 3
range_m = 600
rounds_per_salvo = 330               # jedna taśma
shots_per_salvo = 25
# Historycznie 400-450 strz./min w praktyce (Muzeum im. Orła Białego), ale gra mocno zaniża
# karabiny (MG34 326, Reibel 265, M1919 259), więc dla balansu: 330 * 60 / (10 + 24 * 2) = 341 r/m.
# Historyczne 430 dawało seconds_between_shots = 1.5.
seconds_between_shots = 2.0
seconds_between_salvos = 10.0

# nkm 20 mm wz. 38 FK-A (TKS Orlika). Wzorzec: KwK 38 20 mm z Panzera II (AP 4, 800 m, 171 r/m).
# Magazynki 5-nabojowe: seria = magazynek, a jego wymiana obniża tempo praktyczne do ok. 80 strz./min.
# Przebicie 5: nkm przebijał więcej niż KwK 30/38, a Orlik niszczył nim czołgi 35(t) i Panzer I/II.
[ammo.Ammo_nkm_wz38_AP]
copy_of = "Ammo_KwK_38L55_20mm_AP"
name = "Nkm20"
caliber = "20mm"
penetration = 5
accuracy = 6
accuracy_moving = 4
range_m = 800
rounds_per_salvo = 5                 # jeden magazynek
shots_per_salvo = 5
seconds_between_shots = 0.19         # 320 strz./min teoretycznie w serii (derela.pl)
seconds_between_salvos = 3.0         # wymiana magazynka; ROF = 5 * 60 / (3 + 4 * 0.19) = 80 r/m w praktyce

[ammo.Ammo_nkm_wz38_HE]
copy_of = "Ammo_KwK_38L55_20mm_HE"
name = "Nkm20"
caliber = "20mm"
accuracy = 6
accuracy_moving = 4
range_m = 800
rounds_per_salvo = 5                 # jeden magazynek
shots_per_salvo = 5
seconds_between_shots = 0.19         # 320 strz./min teoretycznie w serii (derela.pl)
seconds_between_salvos = 3.0         # wymiana magazynka; ROF = 5 * 60 / (3 + 4 * 0.19) = 80 r/m w praktyce

