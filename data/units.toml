# Ustawienia jednostek, broni i napisów battlegroupy Wrzesien1939.
#
# Po zmianie uruchom zainstaluj_mod.bat: mod zostanie zbudowany od nowa z tych wartości.
# Linie zaczynające się od # to komentarze. Liczby piszemy z kropką (1.5, nie 1,5).
# Opis pól i wzory gry: docs/USTAWIENIA_JEDNOSTEK.md.

# ---------------------------------------------------------------------------------------------
# Jednostki. Nazwa sekcji to identyfikator jednostki w grze (nie zmieniać).
# ---------------------------------------------------------------------------------------------

[units.TP7_JW_POL]
model = "TP7_JW"                 # pliki modelu w models\ (nie zmieniać)
unit_base = "Cromwell_V_POL"     # wpis gry, z którego kopiowane są dane jednostki (nie zmieniać)
weapon_base = "Stuart_M3A3_POL"  # wpis gry, z którego kopiowane są broń i wygląd w bitwie (nie zmieniać)
layout = "tp7_jw"                # układ broni w skrypcie (nie zmieniać)
stocks = ["Ammo_Bofors_wz37_AP", "Ammo_Bofors_wz37_HE", "Ammo_ckm_wz30_vehicule"]  # kolejność zapasów (nie zmieniać)
name = "TP7JW"                   # token napisu z sekcji [texts]
alias = "7TP jw"                 # nazwa w plikach gry, nie jest wyświetlana
price = 45                       # cena w punktach
year = 1939                      # rok produkcji
# Prędkość w skali gry: prawdziwy 7TP jechał ok. 37 km/h po drodze, gra zawyża drogę wszystkim
# czołgom (Panzer I B 22/60, Panzer II C 30/65, H35 18/52), patrz docs/POROWNANIE_CZOLGOW.md.
speed_kmh = 22                   # prędkość w terenie, jak w oknie jednostki
road_speed_kmh = 58              # prędkość na drodze
strength = 8                     # wytrzymałość (MaxDamages)
concealment = 1.5                # maskowanie: 1.0 = Very bad, 1.5 = Bad (jak lekkie czołgi w grze)
# Pancerz (dws-xip.com): kadłub z przodu 17 mm (dolna płyta 10 mm), wieża 15 mm, strop 10 mm,
# nad silnikiem 5 mm. W grze ok. 14,5 mm = 2, 20-25 mm = 3, 30 mm = 4-5 (Panzer II C, Luchs, Stuart).
# Gra nie ma osobnego pancerza wieży, tylko przód, boki, tył i dach.
armor_front = 2                  # pancerz: liczby na tarczach w oknie jednostki
armor_sides = 2
armor_rear = 1
armor_top = "Toit_Lourd"         # dach: Toit_Lourd = zamknięty (Top: Enclosed)
# Zapas amunicji w nabojach (dzielony przez rounds_per_salvo z sekcji [ammo...]).
# Źródło: derela.pl, opis 7TP: 80 nabojów do Boforsa, 3960 do ckm (12 taśm po 330).
# Udział pocisków odłamkowych w 1939 r. jest niepewny, więc HE ma symboliczne 10.
ammo = { Ammo_Bofors_wz37_AP = 70, Ammo_Bofors_wz37_HE = 10, Ammo_ckm_wz30_vehicule = 3960 }

[units.TP7_DW_POL]
model = "TP7_DW"
unit_base = "Cromwell_V_POL"
weapon_base = "Stuart_M3A3_POL"
layout = "tp7_dw"
stocks = ["Ammo_ckm_wz30_vehicule", "Ammo_ckm_wz30_vehicule"]
name = "TP7DW"
alias = "7TP dw"
price = 30
year = 1939
speed_kmh = 22
road_speed_kmh = 58
strength = 8
concealment = 1.5
# Pancerz (dws-xip.com): kadłub jak w jednowieżowym, wieżyczki 13 mm, strop 5 mm.
armor_front = 2
armor_sides = 2
armor_rear = 1
armor_top = "Toit_Lourd"
# Zapas na JEDEN z dwóch ckm. Źródło: derela.pl, ok. 6000 nabojów na oba karabiny.
ammo = { Ammo_ckm_wz30_vehicule = 2970 }

# As: TKS z nkm 20 mm wz. 38 FK-A, czołg kpr. pchor. Romana Orlika (wrzesień 1939).
# Dane jednostki ze Stuarta (rozpoznanie gąsienicowe, bez przewożenia piechoty), broń i wygląd
# w bitwie z Panzera II C (działko 20 mm), model TKS20 z models\.
[units.TKS20_ACE_POL]
model = "TKS20"
unit_base = "Stuart_M3A3_POL"
weapon_base = "Panzer_II_C_Bef"
layout = "tks20"
stocks = ["Ammo_nkm_wz38_AP"]    # AP i HE mają wspólny zapas, jak w Panzerze II
name = "TKS20Orl"
alias = "TKS 20mm Orlik"
ace_name = "AceOrlik"            # stałe nazwisko dowódcy asa (token z [texts]); jednostka dostaje IsAce
type = "ArmoReco"                # rola: rozpoznanie pancerne (jak Stuart, Humber)
price = 50
year = 1939
# TKS jechał ok. 40 km/h po drodze, szybciej od 7TP; w skali gry jak lekkie pojazdy gąsienicowe.
speed_kmh = 28
road_speed_kmh = 65
strength = 5                     # niska odporność (Universal Carrier ma 6, czołgi 8)
concealment = 2.5                # bardzo dobre maskowanie: niska, mała tankietka (piechota rozpoznania ma 2.5)
optics = 200                     # dobra optyka rozpoznania (Stuart zwiadowczy ma 200)
gun_traverse_deg = 12            # nkm w jarzmie kulistym w kadłubie: obrót w poziomie ograniczony
# Pancerz TKS: 8-10 mm.
armor_front = 1
armor_sides = 1
armor_rear = 1
armor_top = "Toit_Lourd"
# Zapas: TKS z nkm 20 mm przewoził standardowo 80 nabojów w 16 magazynkach po 5 (zbiam.pl, opis TKS
# z nkm FK-A). Ile miał Orlik pod Pociechą, nie wiadomo. W grze: 16 serii (magazynków) po 5.
ammo = { Ammo_nkm_wz38_AP = 80 }

# Myśliwiec PZL P.11c. Wszystko (dane, broń, wygląd w locie) z polskiego Hurricane'a z gry;
# cztery działka 20 mm Hispano zamienione na cztery km wz. 33 kal. 7,92 mm (Browning, jak .303
# w grze). Część P.11c miała tylko dwa km w kadłubie; tu cztery (dwa w kadłubie, dwa w skrzydłach).
[units.P11C_POL]
model = "P11C"
asset_folder = "POL/Avion"          # model w Assets/3D/Units/POL/Avion/P11C
unit_base = "Hurricane_POL"
weapon_base = "Hurricane_POL"
layout = "aircraft"
stocks = ["Ammo_km_wz33_x4_AirAir"]   # tryb powietrze-powietrze i powietrze-ziemia mają wspólny zapas
replace_ammo = { Ammo_Hispano_II_20mm_x4_Hurricane_AirAir = "Ammo_km_wz33_x4_AirAir", Ammo_Hispano_II_20mm_x4_Hurricane_AirSol = "Ammo_km_wz33_x4_AirSol" }
replace_fx = { Hispano_II_20mm_x4_Hurricane = "Browning_303_x4" }   # efekty i dźwięk strzałów karabinów
# Śmigło dwułopatowe o średnicy ok. 2,8 m (promień 1,4 m = 284 jednostki gry; Hurricane 325, trzy łopaty),
# polski pilot. Podwozie stałe jest w głównym modelu; plik P11C_train (punkty Train_Avant i
# Train_Arriere, jak Storch z gry) ustawia samolot na ziemi w podglądzie.
depiction_replace = { "PaleLength = 325" = "PaleLength = 284", "PaleCount = 3" = "PaleCount = 2", "DepictionSubDepiction_Pilote_UK" = "DepictionSubDepiction_Pilote_POL" }
train_model = true                  # eksport i wpis P11C_train (bez niego samolot w podglądzie leży na kadłubie)
name = "PZLP11c"
alias = "PZL P.11c"
price = 60                          # Hurricane z 4 x 20 mm kosztuje 110
year = 1939
# Prędkość w jednostkach gry. Hurricane: 1000 (ok. 540 km/h), 650 w walce. P.11c: ok. 390 km/h.
air_speed = 720
air_combat_speed = 470
strength = 6                        # Hurricane 7
armor_front = "Avion_Lourd"         # stopnie pancerza samolotów w grze: Avion, Avion_Lourd, Avion_Ultra_Lourd
armor_sides = "Avion"
armor_rear = "Avion"
armor_top = "Avion"
# Zapas do sprawdzenia w źródłach; przyjęto 700 nabojów jak Seafire z 4 x .303 w grze (20 serii po 35).
ammo = { Ammo_km_wz33_x4_AirAir = 700 }

# 37 mm armata ppanc wz. 36 Bofors. Dane jednostki (polska flaga, głosy, portret obsługi) z polskiej
# armaty 6-pdr z gry; broń, efekty strzału i wygląd (dwóch żołnierzy obsługi, animacje armaty) z
# amerykańskiej M3 37 mm, najbliższej Boforsowi wielkością i wagą. Model ma osie w miejscach z M3,
# bo animacje M3 zapisują położenia węzłów (zob. scripts/spec_wz36.py).
[units.WZ36_POL]
model = "WZ36_BOFORS"
asset_folder = "POL/Canon"         # model w Assets/3D/Units/POL/Canon/WZ36_BOFORS, razem z Boites_WZ36_BOFORS
unit_base = "Canon_6pdr_POL"
weapon_base = "Canon_37mmAT_US"
layout = "gun"
stocks = ["Ammo_Bofors_wz36_AP"]
rts_texture = "Texture_RTS_H_Canon_37mmAT"   # znaczek nad jednostką: ikona armaty z gry, jak M3
transporter = "PF621L_POL"         # ciągnik w paczce: nasza ciężarówka Polski Fiat 621L (wcześniej Loyd z gry)
name = "WZ36"
alias = "37mm wz.36"
price = 30                         # M3 kosztuje 40 (przebicie 8), 6-pdr 60
year = 1936
speed_kmh = 15                     # obsługa pcha armatę (M3: 15 km/h, 6-pdr 12,5)
road_speed_kmh = 15
strength = 4                       # jak M3
concealment = 2.5                  # jak M3 i 6-pdr: niska armata
gun_traverse_deg = 15              # jak M3 w grze; prawdziwy Bofors 50° (±25°), ale przy większym obrocie tarcza z osią M3 weszłaby w koła
armor_front = "Canon_Lourd"        # jak wszystkie armaty w grze
armor_sides = "Canon_Lourd"
armor_rear = "Canon_Lourd"
armor_top = "Canon_Lourd"
# Zapas: M3 w grze ma 55. Ile pocisków miała obsługa przy armacie, do sprawdzenia w źródłach.
ammo = { Ammo_Bofors_wz36_AP = 60 }

# Ciężarówka Polski Fiat 621L z plandeką: ciągnik armaty wz. 36 i transport. Dane jednostki
# (polskie głosy i flaga, przewóz piechoty i holowanie armat: znacznik "Armes_tractees", 3 miejsca)
# z polskiego Bedforda z gry; wygląd (ruch kół, dźwięk silnika, holowana armata) z Opla Blitza,
# bo nasz model ma jego układ węzłów, z polskim kierowcą. Bez broni.
# Prawdziwy 621L: 46 KM, ok. 50-55 km/h, ładowność 2,5 t; Opel Blitz 68-75 KM, 80-85 km/h, 3 t.
[units.PF621L_POL]
model = "PF621L"
asset_folder = "POL/Vehicule"      # model w Assets/3D/Units/POL/Vehicule/PF621L
unit_base = "Truck_Bedford_POL"
weapon_base = "Opel_Blitz"
layout = "truck"
depiction_replace = { "DepictionSubDepiction_Driver_GER" = "DepictionSubDepiction_Driver_POL" }
rts_texture = "Texture_RTS_H_Truck_GMC"   # znaczek nad jednostką jak u Bedforda
name = "PF621L"
alias = "Polski Fiat 621L"
price = 0                          # transport: cena wliczona w paczkę, jak Bedford i Opel
year = 1935
# Gra: Opel Blitz 20 / 85 km/h, Bedford 20 / 80. Fiat był o około 1/3 wolniejszy.
speed_kmh = 18
road_speed_kmh = 55
strength = 6                       # jak Bedford i Opel
concealment = 1.5
armor_front = "Vehicule"
armor_sides = "Vehicule"
armor_rear = "Vehicule"
armor_top = "Toit"

# Ciągnik gąsienicowy C2P (1937): podwozie tankietki TKS wydłużone, z opuszczonym tylnym kołem,
# otwarte nadwozie, kierowca i 3 artylerzystów. Ciągnął głównie armaty przeciwlotnicze 40 mm wz. 36.
# Dane jednostki i wygląd (gąsienice, dźwięk silnika, polski kierowca, holowana armata) z polskiego
